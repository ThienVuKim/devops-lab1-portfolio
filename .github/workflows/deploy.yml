
# DevOps Lab 1 — CI/CD + Lighthouse CI

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cấp quyền cho GitHub Actions đẩy code lên nhánh gh-pages
permissions:
  contents: write

jobs:
  # Job 1: Kiểm tra HTML và audit Lighthouse
  audit:
    name: Validate HTML & Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML files
        run: |
          for file in front_end/index.html front_end/about.html front_end/contact.html front_end/styles.css front_end/assets/avatar.jpg; do
            if [ -f "$file" ]; then
              echo "Found: $file"
            else
              echo "Missing: $file"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install

      - name: Run Lighthouse CI
        run: npx lhci autorun

  # Job 2: Deploy website sau khi audit thành công
  build-and-deploy:
    name: Deploy to GitHub Pages
    needs: audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./front_end
          publish_branch: gh-pages
          commit_message: "Auto-deploy from CI pipeline"
